[project]
name = "ctf-workbench"
version = "0.1.0"
description = "Local-first workbench for CTFs and cryptic hunts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.165.0",
    "pydantic-settings==2.16.1",
]

[project.scripts]
ctf-workbench-api = "ctf_workbench.api.__main__:main"
ctf-workbench-worker = "ctf_workbench.jobs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf_workbench"]

[tool.hatch.build.targets.wheel.sources]
"src/ctf_workbench" = "ctf_workbench"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
